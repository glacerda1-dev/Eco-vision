[package]
name = "eco-vision"
version = "0.1.0"
edition = "2024"
description = "Protótipo Eco Vision para desafios urbanos e ambientais"

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
incremental = false

[profile.test]
incremental = false


